<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>海哥的多线作战台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#F7F7F5;color:#2C2C2A;line-height:1.6;font-size:14px;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid rgba(0,0,0,0.08);border-radius:12px;padding:16px;margin-bottom:16px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:18px;font-weight:600;letter-spacing:-.2px}
.sub{font-size:13px;color:#6B6A66;margin-top:2px}
h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
h2 svg{width:16px;height:16px;flex-shrink:0}
.hint{font-size:12px;color:#8A8985;font-weight:400}
.btn{min-height:44px;padding:0 16px;border:1px solid rgba(0,0,0,0.12);background:#fff;border-radius:8px;font-size:14px;font-family:inherit;cursor:pointer;color:#2C2C2A;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{background:#F1EFE8}
.btn svg{width:16px;height:16px}
.btn-p{background:#185FA5;border-color:#185FA5;color:#fff}
.btn-p:active{background:#0C447C}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:6px}
.iconbtn{min-width:44px;min-height:44px;border:1px solid rgba(0,0,0,0.12);background:#fff;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#5F5E5A}
.iconbtn svg{width:18px;height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:#F1EFE8;border-radius:10px;padding:12px}
.stat .k{font-size:12px;color:#6B6A66}
.stat .v{font-size:24px;font-weight:600;line-height:1.2;margin-top:2px}
.stat .v.red{color:#A32D2D}.stat .v.amb{color:#854F0B}
.todo{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:8px;margin-bottom:6px;border-left:3px solid #B4B2A9;background:#FAFAF8}
.todo.od{background:#FCEBEB;border-left-color:#E24B4A}
.todo.dn{opacity:.5}
.todo.dn .tt{text-decoration:line-through}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex-shrink:0}
.tbody{flex:1;min-width:0}
.tt{font-size:14px;font-weight:500}
.tm{font-size:12px;color:#8A8985;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;padding:1px 7px;border-radius:10px;background:#F1EFE8;color:#5F5E5A;white-space:nowrap}
.odl{color:#A32D2D;font-weight:500}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:12px;color:#6B6A66;font-weight:500;padding:8px 6px;border-bottom:1px solid rgba(0,0,0,0.1)}
.tb td{padding:10px 6px;border-bottom:1px solid rgba(0,0,0,0.06);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.nm{font-weight:500}
.cells{display:none}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap;display:inline-block}
.b-od{background:#FCEBEB;color:#A32D2D}
.b-warn{background:#FAEEDA;color:#854F0B}
.b-ok{background:#EAF3DE;color:#3B6D11}
.b-info{background:#E6F1FB;color:#185FA5}
.pf{margin-bottom:12px}
.pfh{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:5px}
.pfh .pn{font-weight:500;display:flex;align-items:center;gap:6px}
.bar{height:6px;background:#F1EFE8;border-radius:3px;overflow:hidden}
.bar i{display:block;height:6px;border-radius:3px}
#tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding:8px 0 4px;position:sticky;top:0;background:#F7F7F5;z-index:9}
#tabs button{min-height:40px;padding:0 14px;border-radius:8px;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap;border:0.5px solid var(--color-border-tertiary,rgba(0,0,0,.12));background:#fff;color:#5F5E5A;flex-shrink:0}
#tabs button.on{font-weight:500}
.pjhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pjname{font-size:17px;font-weight:500;margin-bottom:2px}
.pjdesc{font-size:13px;color:#6B6A66}
.bar{height:6px;background:#F1EFE8;border-radius:3px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:6px;border-radius:3px}
/* W5 学科成绩三块卡 */
.sc3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.sc3 .sc{border:1px solid #E8E6DF;border-radius:12px;padding:14px 15px;background:#FCFCFA;
  cursor:pointer;text-align:left;transition:box-shadow .15s,border-color .15s;width:100%;font:inherit}
.sc3 .sc:hover{border-color:#C9C6BC;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.sc3 .sc .k{font-size:12px;color:#6B6A66;display:flex;align-items:center;justify-content:space-between}
.sc3 .sc .v{font-size:26px;font-weight:600;margin:4px 0 2px;line-height:1.15}
.sc3 .sc .n{font-size:12px;color:#8A8985;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc3 .sc .d{font-size:11px;color:#B4B2A9;margin-top:2px}
.sc3 .sc.empty .v{font-size:15px;color:#B4B2A9;font-weight:500}
.sc3 .sc .more{font-size:11px;color:#185FA5}
/* 成绩浮窗 */
.mask{position:fixed;inset:0;background:rgba(44,44,42,.42);z-index:900;display:none;
  align-items:center;justify-content:center;padding:20px}
.mask.on{display:flex}
.mdl{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:86vh;overflow:auto;
  box-shadow:0 18px 50px rgba(0,0,0,.22)}
.mdl .mhd{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 18px;border-bottom:1px solid #EFEDE6;position:sticky;top:0;background:#fff;z-index:2}
.mdl .mhd .t{font-size:15px;font-weight:600}
.mdl .mhd .x{border:none;background:#F1EFE8;border-radius:8px;width:30px;height:30px;cursor:pointer;
  font-size:15px;color:#5F5E5A;line-height:1}
.mdl .mhd .x:hover{background:#E8E6DF}
.mdl .mbody{padding:16px 18px 20px}
.mdl .sec{font-size:12px;color:#8A8985;margin:14px 0 8px;font-weight:600}
.mdl .sec:first-child{margin-top:0}
.srow{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px dashed #EFEDE6;font-size:13px}
.srow:last-child{border-bottom:none}
.srow .sv{font-size:17px;font-weight:600;min-width:52px;text-align:right;flex-shrink:0}
.srow .sn{flex:1;min-width:0}
.srow .sd{font-size:11px;color:#B4B2A9;flex-shrink:0}
.srow .sb{font-size:11px;color:#8A8985;width:100%;padding-left:62px;margin-top:-4px}
.mform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.mform .full{grid-column:1/-1}
.mform .fld label{display:block;font-size:11px;color:#8A8985;margin-bottom:3px}
.mform .fld .inp{width:100%;font-size:14px}
.mform .row{grid-column:1/-1;display:flex;gap:8px}
.mempty{font-size:12.5px;color:#8A8985;padding:10px 0}
@media(max-width:640px){
  .sc3{grid-template-columns:1fr}
  .mform{grid-template-columns:1fr}
}
.rk{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px}
.rk .no{width:20px;height:20px;border-radius:4px;background:#F1EFE8;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#5F5E5A}
.rk .nm{width:130px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .bw{flex:1;min-width:40px;height:14px;background:#F1EFE8;border-radius:3px;overflow:hidden}
.rk .bw i{display:block;height:14px;border-radius:3px}
.rk .vl{width:82px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#6B6A66;margin-bottom:10px}
.lgd span{display:inline-flex;align-items:center;gap:5px}
.lgd i{width:8px;height:8px;border-radius:2px;display:inline-block}
@media(max-width:768px){
 .rk .nm{width:84px;font-size:12px}
 .rk .vl{width:66px;font-size:12px}
}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12px;color:#6B6A66;margin-bottom:4px}
.inp,select,textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid rgba(0,0,0,0.14);border-radius:8px;font-size:16px;font-family:inherit;background:#fff;color:#2C2C2A}
.inp:focus,select:focus,textarea:focus{outline:2px solid rgba(24,95,165,.25);border-color:#185FA5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sync{font-size:12px;color:#6B6A66;display:inline-flex;align-items:center;gap:5px}
.sync .sdot{width:7px;height:7px;border-radius:50%;background:#639922}
.mb{display:none;margin-top:12px;padding-top:14px;border-top:1px dashed rgba(0,0,0,0.12)}
.mb.open{display:block}
.empty{text-align:center;padding:22px 10px;color:#8A8985;font-size:13px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#2C2C2A;color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:999;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
@media(max-width:768px){
 .wrap{padding:12px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .tb{display:none}
 .cells{display:block}
 .cell{background:#FAFAF8;border-radius:8px;padding:10px;margin-bottom:8px}
 .cell .cr{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0}
 .cell .cr b{font-weight:500;color:#5F5E5A}
 .g2{grid-template-columns:1fr}
}

.subnav{display:flex;gap:6px;margin:2px 0 14px;flex-wrap:wrap}
.subnav button{font-size:13px;padding:6px 12px;border-radius:7px;border:1px solid rgba(0,0,0,.1);background:#fff;color:#5F5E5A;min-height:34px;cursor:pointer;font-family:inherit}
.subnav button.on{background:#185FA5;color:#fff;border-color:#185FA5;font-weight:500}
.filt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filt select{font-size:16px;padding:6px 8px;border-radius:7px;border:1px solid rgba(0,0,0,.12);background:#fff;min-height:34px}
.ckrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;background:#FAFAF8;margin-bottom:6px;border-left:3px solid #B4B2A9}
.prof{display:block;padding:12px;border-radius:10px;background:#FAFAF8;margin-bottom:10px;border-left:3px solid #B4B2A9}
.ckrow.done{border-left-color:#0F6E56}
.ckt{font-size:12px;color:#8A8985;width:78px;flex-shrink:0}
.ckn{flex:1;font-size:13px}
.ckb{width:24px;height:24px;border-radius:6px;border:1.5px solid #B4B2A9;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;min-height:24px}
.ckb.on{background:#0F6E56;border-color:#0F6E56}
.ckb svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.ckb.on svg{opacity:1}
.skug{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;margin-top:6px}
.skuc{border:1px solid rgba(0,0,0,.08);border-radius:8px;padding:9px 10px;font-size:13px;background:#fff}
.skuc .kt{font-weight:500;margin-bottom:2px}
.kpirow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.05);font-size:13px}
.kpin{width:96px;flex-shrink:0}
.kpib{flex:1;min-width:60px;height:8px;background:#F1EFE8;border-radius:4px;overflow:hidden}
.kpib i{display:block;height:100%;border-radius:4px}
.kpis{width:52px;text-align:right;flex-shrink:0;font-weight:500}
.sec{font-size:13px;font-weight:500;margin:16px 0 8px}
@media(max-width:768px){
  .skug{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .ckt{width:66px;font-size:11px}
  .kpin{width:78px;font-size:12px}
}

</style>
</head>
<body>
<div class="wrap">

<div class="hd">
  <div>
    <h1>海哥的多线作战台</h1>
    <div class="sub">旺旺膨化 · AI小游戏 · 海外TikTok · 六爻抖音 · 孩子作业</div>
  </div>
  <div class="row">
    <span class="sync" id="sync"><span class="sdot"></span><span id="syncTx">已同步</span></span>
    <button class="iconbtn" id="btnExport" title="导出 JSON 备份" aria-label="导出备份"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg></button>
    <button class="iconbtn" id="btnImport" title="导入恢复" aria-label="导入恢复"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 19h16"/></svg></button>
  </div>
</div>
<input type="file" id="fileImp" accept="application/json" style="display:none">

<nav id="tabs"></nav>

<div id="tabToday">
<div class="card">
  <div class="hd">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>今天要处理</h2>
    <span class="hint" id="todayHint" data-sp-bindable="database" data-sp-database-id="1gQHCbHHyZIFJDGIrzyWrJ"></span>
  </div>
  <div id="todoList" data-sp-bindable="database" data-sp-database-id="1gQHCbHHyZIFJDGIrzyWrJ"></div>
  <div class="row" style="margin-top:10px">
    <button class="btn btn-p btn-sm" id="btnAddTodo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新增待办</button>
    <button class="btn btn-sm" id="btnPostpone">全部顺延到今天</button>
  </div>
  <div class="mb" id="mbTodo">
    <div class="fld"><label>事项</label><input class="inp" id="tTitle" placeholder="例如：跟进恒隆回款"></div>
    <div class="g2">
      <div class="fld"><label>所属工作线</label><select id="tLine"></select></div>
      <div class="fld"><label>优先级</label><select id="tPri"></select></div>
    </div>
    <div class="g2">
      <div class="fld"><label>截止日期</label><input class="inp" type="date" id="tDue"></div>
      <div class="fld"><label>目标数量</label><input class="inp" type="number" id="tGoal" value="1" min="1"></div>
    </div>
    <div class="row"><button class="btn btn-p" id="tSave">保存</button><button class="btn" id="tCancel">取消</button></div>
  </div>
</div>
</div>

<div id="tabProj" style="display:none">
<div class="card">
  <div class="hd">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="#534AB7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>项目进度总览</h2>
    <span class="hint">全部工作线</span>
  </div>
  <div id="projList" data-sp-bindable="database" data-sp-database-id="1gQHCbHHyZIFJDGIrzyWrJ"></div>
  <div class="row" style="margin-top:10px">
    <button class="btn btn-p btn-sm" id="btnAddProj"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新增里程碑</button>
  </div>
  <div class="mb" id="mbProj">
    <div class="fld"><label>里程碑</label><input class="inp" id="pTitle" placeholder="例如：TikTok 起号跑通模型"></div>
    <div class="fld"><label>所属工作线</label><select id="pLine"></select></div>
    <div class="g2">
      <div class="fld"><label>当前进度</label><input class="inp" type="number" id="pNow" value="0"></div>
      <div class="fld"><label>目标数</label><input class="inp" type="number" id="pGoal" value="100"></div>
    </div>
    <div class="fld"><label>截止日期</label><input class="inp" type="date" id="pDue"></div>
    <div class="row"><button class="btn btn-p" id="pSave">保存</button><button class="btn" id="pCancel">取消</button></div>
  </div>
</div>
</div>

<div id="tabProject" style="display:none">
<div class="card" id="pjHead"></div>
<div class="stats" id="pjStats" data-sp-bindable="database" data-sp-database-id="cHPTKdlZZXnjPrU1Y9C9FS"></div>

<div class="card">
  <div class="hd"><h2 id="pjStatTitle" style="display:flex;align-items:center;gap:8px"></h2><span class="hint" id="pjStatHint"></span></div>
  <div id="pjStatBox"></div>
</div>

<div id="wwBlocks" style="display:none">
<div class="card">
  <div class="hd"><h2 style="display:flex;align-items:center;gap:8px"><svg viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>信息录入</h2><span class="hint">语音 / 文字 · 存进随手记</span></div>
  <div id="wwNoteBox" data-sp-bindable="database" data-sp-database-id="PouGOpqFGDOBIEayNHdayk"></div>
</div>
<div class="card">
  <div class="hd"><h2 style="display:flex;align-items:center;gap:8px"><svg viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>每日打卡</h2><span class="hint">8:30 上班卡 → 17:30 下班卡</span></div>
  <div id="wwCheckBox" data-sp-bindable="database" data-sp-database-id="2oiXI7NgV4T56mTqDJgaNu"></div>
</div>
<div class="card">
  <div class="hd"><h2 style="display:flex;align-items:center;gap:8px"><svg viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>客户档案</h2><span class="hint">订货日期 · 产品 · 数量 · 金额 · 在卖 SKU</span></div>
  <div id="wwCustBox" data-sp-bindable="database" data-sp-database-id="JTZew6TvIp5hG4EKe71u5L"></div>
</div>
</div>

<div class="card">
  <div class="hd"><h2 id="pjListTitle" style="display:flex;align-items:center;gap:8px"></h2><span class="hint" id="pjListHint"></span></div>
  <div id="pjTodoList" data-sp-bindable="database" data-sp-database-id="1gQHCbHHyZIFJDGIrzyWrJ"></div>
</div>
</div>

</div>

<div style="text-align:center;font-size:12px;color:#8A8985;padding:8px 0 20px">
  本工作台通过 WorkBuddy 资料库搭建 · 数据云端存储 · 多设备自动同步
</div>

<div class="toast" id="toast"></div>

<!-- 学科成绩浮窗：W5 头部三块卡点击后弹出 -->
<div class="mask" id="scoreMask">
  <div class="mdl" id="scoreMdl" role="dialog" aria-modal="true"></div>
</div>
<script>
(function(){
"use strict";

var LINES = {
  '旺旺膨化':   {c:'#185FA5', bg:'#E6F1FB'},
  '旺旺主业':   {c:'#185FA5', bg:'#E6F1FB'},

/* ===== SDK 连接自愈 =====
   平台 inject.js 理论上先于页面脚本执行，但实测存在取不到的情况（iframe 预热、异步注入）。
   一旦开头没拿到就永远离线，所有写库都会静默失败。这里做三层兜底：
   1) getDb() 惰性再取一次 —— 任何时刻调用都可能拿到后来才注入的 SDK
   2) waitForDb() 轮询等待 —— init 前先等一段时间
   3) autoReconnect() 后台轮询 —— 已经进入离线后仍能自动恢复
   另外 sdkDiag() 把 window.__SMART_PAGE__ 的真实状态暴露到界面，便于定位。 */
function getDb(){
  try{ return (window.__SMART_PAGE__ && window.__SMART_PAGE__.database) || null; }
  catch(_e){ return null; }
}
function ensureDb(){ if(!db) db = getDb(); return db; }
function waitForDb(maxMs, step){
  return new Promise(function(res){
    var t0 = Date.now();
    (function tick(){
      var d = getDb();
      if(d){ db = d; online = true; return res(true); }
      if(Date.now() - t0 >= (maxMs||8000)) return res(false);
      setTimeout(tick, step||150);
    })();
  });
}
/* 离线后继续后台探活，一旦连上自动拉数据并刷新（无需用户刷新页面） */
var reconnTimer = null;
function autoReconnect(rounds){
  if(reconnTimer) return;
  var left = rounds || 100;   // 每 2 秒一次，约 3 分钟
  reconnTimer = setInterval(function(){
    var d = getDb();
    if(!d){ left--; if(left<=0){ clearInterval(reconnTimer); reconnTimer=null; } return; }
    clearInterval(reconnTimer); reconnTimer=null;
    db = d; online = true;
    setSync('同步中');
    fetchData().then(function(){
      setSync('已同步');
      toast('已重新连上数据表');
      refreshAll();
    }, function(){ setSync('离线模式'); refreshAll(); });
  }, 2000);
}

  var keys = [];

/* 日期归一：云端可能返回 2026-10-09 / 2026-10-09T00:00:00Z / 时间戳，统一成 YYYY-MM-DD */
function dayKey(v){
  var s=String(v==null?'':v).trim();
  if(!s) return '';
  var m=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+'-'+m[2]+'-'+m[3];
  var d=new Date(isNaN(Number(s))?s:Number(s));
  return isNaN(d.getTime())?s.slice(0,10):ymd(d);
}

function ymd(d){
  var m=String(d.getMonth()+1); if(m.length<2)m='0'+m;
  var day=String(d.getDate()); if(day.length<2)day='0'+day;
  return d.getFullYear()+'-'+m+'-'+day;
}
function parseYmd(s){
  if(!s) return null;
  var p=String(s).slice(0,10).split('-');
  if(p.length<3) return null;
  var d=new Date(+p[0], +p[1]-1, +p[2]);
  return isNaN(d.getTime())?null:d;
}
/* 相对今天的天数差：负数=已过期 */
function dayDiff(dateStr){
  var d=parseYmd(dateStr); if(!d) return null;
  var now=new Date(); now.setHours(0,0,0,0);
  return Math.round((d.getTime()-now.getTime())/86400000);
}
function fmtDue(dateStr){
  var diff=dayDiff(dateStr);
  if(diff===null) return '无期限';
  if(diff<0) return '逾期 '+Math.abs(diff)+' 天';
  if(diff===0) return '今天到期';
  if(diff===1) return '明天到期';
  return diff+' 天后';
}

    var v=props[k];
    flat[k]=(v && typeof v==='object') ? (v.text!==undefined?v.text:(v.select!==undefined?v.select:(v.number!==undefined?v.number:(v.currency!==undefined?v.currency:(v.date!==undefined?v.date:v.checkbox))))) : v;
  });
  flat.id='local_'+Date.now();
  cache[kind]=(cache[kind]||[]).concat([flat]);
  localCache(kind, cache[kind]);
  toast('当前离线模式，已存本地；在资料库页面打开可写云端');

}

function cacheFormInputs(){
  FORM_CACHE_IDS.concat(SELECT_CACHE_IDS).forEach(function(id){
    var n=$(id); if(!n) return;
    n.addEventListener('input', scheduleCache);
    n.addEventListener('change', scheduleCache);
  });
}
var cacheTimer=null;
function scheduleCache(){
  if(cacheTimer) clearTimeout(cacheTimer);
  cacheTimer=setTimeout(function(){
    var draft={};
    FORM_CACHE_IDS.forEach(function(id){
      var n=$(id); if(n && n.value) draft[id]=n.value;
    });
    SELECT_CACHE_IDS.forEach(function(id){
      var n=$(id); if(n && n.value) draft[id]=n.value;
    });
    try{ localStorage.setItem(LS+'draft', JSON.stringify(draft)); }catch(e){}
  }, 300);
}
function restoreFormInputs(){
  var draft;
  try{ draft=JSON.parse(localStorage.getItem(LS+'draft')||'null'); }catch(e){ return; }
  if(!draft) return;
  FORM_CACHE_IDS.forEach(function(id){
    var n=$(id); if(n && draft[id]) n.value=draft[id];
  });
  SELECT_CACHE_IDS.forEach(function(id){
    var n=$(id); if(n && draft[id]) n.value=draft[id];
  });

/* ===== 计算层（纯函数） ===== */
function todoRows(){
  return cache.todos.map(function(t){
    return {
      id:t._id,
      title:t['事项']||'(未命名)',
      line:t['所属工作线']||'',
      due:t['截止日期']||'',
      pri:t['优先级']||'P2 常规',
      done:t['完成']===true,
      od:(function(){ var d=dayDiff(t['截止日期']); return d!==null && d<0; })(),
      note:t['备注']||'',
      goal:Number(t['总目标数'])||1,
      kind:t['类型']||'待办',
      now:Number(t['进度'])||0,
      total:Number(t['总目标数'])||100
    };
  });
}
function computeTodayList(){
  return todoRows().filter(function(t){
    if(t.done || t.kind==='项目里程碑') return false;
    var d=dayDiff(t.due);
    return d===null ? true : d<=2;
  }).sort(function(a,b){
    var pa=a.pri.slice(0,2), pb=b.pri.slice(0,2);
    if(pa!==pb) return pa<pb?-1:1;
    if(a.od!==b.od) return a.od?-1:1;
    return dayDiff(a.due)-dayDiff(b.due);
  });
}

/* 兼容历史数据：待办表里旧记录的「所属工作线」仍写着「旺旺主业」 */

function computeProjectTodos(key){

              pct: Math.max(0, Math.min(100, Math.round(t.now/t.total*100))),

/* 产品元信息：规格取「客户在卖SKU」表，参考价取历史订货最近一次单价 */
function skuMeta(name){
  var spec='', price=0, pdate='';
  if(!name) return {spec:'', price:0, date:''};
  cache.skus.forEach(function(s){
    if(String(s['SKU名称']||'')===name && !spec) spec=String(s['规格']||'');
  });
  cache.orders.forEach(function(o){
    if(String(o['SKU名称']||'')!==name) return;
    var p=Number(o['单价(元/箱)'])||0;
    if(!p){ var q=Number(o['数量(箱)'])||0, a=Number(o['金额'])||0; if(q>0) p=a/q; }
    if(p>0 && String(o['订货日期']||'')>=pdate){ pdate=String(o['订货日期']||''); price=p; }
  });
  return {spec:spec, price:Math.round(price*100)/100, date:pdate};
}
/* 当月订货实时汇总（数据回流：读「客户订货明细」表） */
function monthOrderAmt(month){
  var s=0;
  cache.orders.forEach(function(o){
    var d=String(o['订货日期']||'');
    if(!month || d.slice(0,7)===month) s+=Number(o['金额'])||0;
  });
  return s;
}
function blankRow(){

function orderDup(name, rows, existing){
  /* 重复校验：同客户 + 同SKU + 同数量 + 同金额 视为重复（日期不参与，防手抖重复录入） */
  var base=(existing||cache.orders).filter(function(o){
    return o['经销商名称']===name;
  });
  var dups=0;
  rows.forEach(function(r){
    if(!r.sku && !r.qty && !r.amt) return;
    var hit=base.some(function(o){
      return String(o['SKU名称']||'')===String(r.sku||'')
          && (Number(o['数量(箱)'])||0)===(Number(r.qty)||0)
          && (Number(o['金额'])||0)===(Number(r.amt)||0);
    });
    if(hit) dups++;
  });
  return dups;
}

  /* 客户主数据索引（「旺旺·客户档案」表） */
  var master={};
  cache.cust.forEach(function(c){ if(c['客户名称']) master[c['客户名称']]=c; });

  names.forEach(function(name){
    if(curCust && name!==curCust) return;
    var m=master[name]||{};
    var ords=cache.orders.filter(function(o){ return o['经销商名称']===name; })
      .sort(function(a,b){ return String(b['订货日期']||'').localeCompare(String(a['订货日期']||'')); });
    var sks=cache.skus.filter(function(s){ return s['经销商名称']===name; });
    var onSale=sks.filter(function(s){ return s['在售状态']==='在卖'; });

    var qty=0, amt=0;
    ords.forEach(function(o){ qty+=Number(o['数量(箱)'])||0; amt+=Number(o['金额'])||0; });
    var lastDate=ords.length?String(ords[0]['订货日期']||'—'):'—';
    var skuNames2=[];
    ords.forEach(function(o){ if(o['SKU名称'] && skuNames2.indexOf(o['SKU名称'])<0) skuNames2.push(o['SKU名称']); });

    /* 档案块 */
    var blk=el('div','prof');
    var head=el('div');
    head.style.cssText='display:flex;align-items:center;gap:6px;flex-wrap:wrap';
    var nm=el('span','ckt', name);
    nm.style.cssText='font-size:15px;font-weight:500';
    head.appendChild(nm);
    if(m['渠道']){ var ch=el('span','tag', m['渠道']); ch.style.background=line.bg; ch.style.color=line.c; head.appendChild(ch); }
    else { var ch2=el('span','tag','渠道未填'); ch2.style.background='#F1EFE8'; ch2.style.color='#6B6A66'; head.appendChild(ch2); }
    if(onSale.length){ var os=el('span','tag','在售 '+onSale.length); os.style.background='#E1F5EE'; os.style.color='#0F6E56'; head.appendChild(os); }
    /* 编辑按钮 */
    var editBtn=el('button','btn btn-sm', custEdit[name]?'收起':'编辑');
    editBtn.type='button';
    editBtn.style.cssText='margin-left:auto;min-height:36px';
    editBtn.onclick=function(){
      custEdit[name]=!custEdit[name];
      if(custEdit[name] && !custDraft[name]){
        custDraft[name]={rows:[blankRow()], force:false,
          master:{'联系人':m['联系人']||'', '联系方式':m['联系方式']||'',
                  '客户地址':m['客户地址']||'', '渠道':m['渠道']||'电商'}};
      }
      refreshAll();
    };
    head.appendChild(editBtn);
    blk.appendChild(head);

    /* 联系信息行 */
    var contact=[];
    contact.push('联系人：'+(m['联系人']||'—'));
    contact.push('联系方式：'+(m['联系方式']||'—'));
    contact.push('地址：'+(m['客户地址']||'—'));
    blk.appendChild(el('div','sub', contact.join('　')));

    /* 订货汇总行 */
    var stat=el('div');
    stat.style.cssText='margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;font-size:13px';
    [['订货笔数', ords.length+' 笔'],['订货数量', qty+' 箱'],['订货金额', fmtMoney(amt)],['最近订货', lastDate]].forEach(function(p){
      var s=el('span');
      s.appendChild(el('span','sub', p[0]+' '));
      var v=el('span','', p[1]); v.style.fontWeight='500'; v.style.color=line.c;
      s.appendChild(v);
      stat.appendChild(s);
    });
    blk.appendChild(stat);

    /* SKU 名称 chips */
    if(skuNames2.length){
      var skuRow=el('div');
      skuRow.style.cssText='margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center';
      skuRow.appendChild(el('span','sub','订过：'));
      skuNames2.forEach(function(k){
        var c=el('span','tag', k);
        c.style.cssText='background:#fff;border:1px solid rgba(0,0,0,.12);color:#3D3D3A;font-weight:400';
        skuRow.appendChild(c);
      });
      blk.appendChild(skuRow);
    }

    /* 在售 SKU chips */
    if(sks.length){
      var onRow=el('div');
      onRow.style.cssText='margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center';
      onRow.appendChild(el('span','sub','在售SKU：'));
      sks.slice().sort(function(a,b){ return (Number(b['月均动销(件)'])||0)-(Number(a['月均动销(件)'])||0); })
        .forEach(function(s){
          var st=s['在售状态']||'';
          var c=el('span','tag', (s['SKU名称']||'')+(st==='在卖'?'':'（'+st+'）'));
          if(st==='在卖'){ c.style.background='#E1F5EE'; c.style.color='#0F6E56'; }
          else if(st==='停卖'){ c.style.background='#FCE8E8'; c.style.color='#A32D2D'; }
          else { c.style.background='#F1EFE8'; c.style.color='#6B6A66'; }
          onRow.appendChild(c);
        });
      blk.appendChild(onRow);
    }

    /* 订单明细小表 */
    if(ords.length){
      var tb=document.createElement('table'); tb.className='tb';
      var thead=document.createElement('thead'); var htr=document.createElement('tr');
      ['订货时间','SKU名称','数量','金额','渠道'].forEach(function(h){
        var th=document.createElement('th'); th.textContent=h;
        th.style.cssText='text-align:left;font-weight:500;color:#8A8985;font-size:12px;padding:6px 8px;border-bottom:1px solid rgba(0,0,0,.08)';
        htr.appendChild(th);
      });
      thead.appendChild(htr); tb.appendChild(thead);
      var tbody=document.createElement('tbody');
      ords.forEach(function(o){
        var tr=document.createElement('tr');
        [String(o['订货日期']||''), o['SKU名称']||'', (Number(o['数量(箱)'])||0)+' 箱', fmtMoney(o['金额']), o['渠道']||''].forEach(function(v,i){
          var td=document.createElement('td');
          td.textContent=v;
          td.style.cssText='padding:7px 8px;border-bottom:1px solid rgba(0,0,0,.05);font-size:12px'+(i===3?';font-weight:500':'');
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      tb.appendChild(tbody);
      var tw=el('div');
      tw.style.cssText='margin-top:8px;overflow-x:auto';
      tw.appendChild(tb);
      blk.appendChild(tw);
    }else{
      blk.appendChild(el('div','sub','暂无订货记录'));
    }

    /* 本客户修改历史（默认 3 条，可展开） */
    var myLogs=cache.logs.filter(function(g){ return String(g['对象']||'')===name; })
      .sort(function(a,b){ return String(b['时间']||'').localeCompare(String(a['时间']||'')); });
    if(myLogs.length){
      var lwrap=el('div');
      lwrap.style.cssText='margin-top:8px';
      var lhd=el('div','sub','修改历史 '+myLogs.length+' 条');
      lhd.style.cssText='font-size:12px;color:#6B6A66;display:flex;align-items:center;gap:6px;cursor:pointer';
      var lgOpen=!!custLogOpen[name];
      if(myLogs.length>3){
        var tg=el('button','btn btn-sm', lgOpen?'收起':'展开全部');
        tg.type='button';
        tg.style.cssText='min-height:26px;padding:0 8px;font-size:12px';
        tg.onclick=function(){ custLogOpen[name]=!lgOpen; refreshAll(); };
        lhd.appendChild(tg);
      }
      lwrap.appendChild(lhd);
      (lgOpen?myLogs.slice(0,20):myLogs.slice(0,3)).forEach(function(g){
        var lr=el('div','sub', (g['时间']||'')+'　'+(g['动作']||'')+'　'+(g['内容']||''));
        lr.style.cssText='font-size:12px;color:#8A8985;margin-top:3px;line-height:1.5';
        lwrap.appendChild(lr);
      });
      blk.appendChild(lwrap);
    }

    /* ===== 行内编辑面板 ===== */
    if(custEdit[name]){
      var draft=custDraft[name]||(custDraft[name]={rows:[blankRow()], force:false});
      var panel=el('div');
      panel.style.cssText='margin-top:10px;border-top:1px dashed rgba(0,0,0,.15);padding-top:10px';

      /* 主数据修改 */
      panel.appendChild(el('div','sec','档案信息修改'));
      var mrow=el('div','row');
      mrow.style.cssText='gap:10px;flex-wrap:wrap';
      function mIn(lb2, key, val){
        var inp=document.createElement('input');
        inp.className='inp'; inp.type='text';
        inp.value=draft.master[key]!==undefined?draft.master[key]:(val||'');
        inp.setAttribute('data-mk', key);
        inp.style.cssText='width:100%;font-size:15px';
        inp.oninput=function(){ draft.master[key]=inp.value; };
        var w=el('div'); w.style.cssText='flex:1;min-width:130px';
        var l=el('div','sub', lb2); l.style.marginBottom='2px';
        w.appendChild(l); w.appendChild(inp);
        return w;
      }
      mrow.appendChild(mIn('联系人','联系人',m['联系人']));
      mrow.appendChild(mIn('联系方式','联系方式',m['联系方式']));
      mrow.appendChild(mIn('客户地址','客户地址',m['客户地址']));
      var chSel2=document.createElement('select');
      chSel2.className='inp';
      chSel2.style.cssText='width:100%;font-size:15px';
      ['电商','商超','特渠','其他'].forEach(function(t){
        var o=document.createElement('option'); o.value=t; o.textContent=t; chSel2.appendChild(o);
      });
      chSel2.value=draft.master['渠道']||m['渠道']||'电商';
      chSel2.setAttribute('data-mk','渠道');
      chSel2.onchange=function(){ draft.master['渠道']=chSel2.value; };
      var chw2=el('div'); chw2.style.cssText='flex:1;min-width:110px';
      var chl2=el('div','sub','渠道'); chl2.style.marginBottom='2px';
      chw2.appendChild(chl2); chw2.appendChild(chSel2);
      mrow.appendChild(chw2);
      panel.appendChild(mrow);

      /* 订货录入（产品名称联想 + +号增行 + 重复校验） */
      panel.appendChild(el('div','sec','订货录入（选产品自动带规格/参考价，金额按数量自动算）'));
      var rowsWrap=el('div');
      rowsWrap.style.cssText='display:flex;flex-direction:column;gap:8px';
      draft.rows.forEach(function(r, idx){
        var rw=el('div','row');
        rw.style.cssText='gap:6px;flex-wrap:wrap;align-items:flex-end';
        var refs={};
        var rhint=el('div','sub','');
        rhint.style.cssText='flex:0 0 100%;min-height:14px;margin-top:-2px';
        function oIn(lb3, key, val, typ, wpx){
          var inp=document.createElement('input');
          inp.className='inp'; inp.type=typ||'text';
          inp.value=(draft.rows[idx] && draft.rows[idx][key]!==undefined) ? draft.rows[idx][key] : (val||'');
          inp.setAttribute('data-rk', key);
          if(key==='sku'){ inp.setAttribute('list','skuNameList'); inp.setAttribute('placeholder','输入或选择产品名'); }
          if(key==='qty') inp.setAttribute('placeholder','箱数');
          inp.style.cssText='width:100%;font-size:15px';
          inp.oninput=function(){
            draft.rows[idx][key]=inp.value;
            if(key==='sku'||key==='qty') autoFill();
            else if(key==='amt') draft.rows[idx].amtManual=true;
          };
          if(key==='sku'||key==='qty') inp.onchange=function(){ autoFill(); };
          refs[key]=inp;
          var w=el('div'); w.style.cssText='flex:1;min-width:90px';
          if(wpx) w.style.maxWidth=wpx;
          var l=el('div','sub', lb3); l.style.marginBottom='2px';
          w.appendChild(l); w.appendChild(inp);
          return w;
        }
        /* 选产品 / 改数量 → 带出规格与参考价，金额 = 数量 × 参考价（手动改过金额则不再覆盖） */
        function autoFill(){
          var meta=skuMeta(String(refs.sku.value||'').trim());
          var txt=[];
          if(meta.spec) txt.push('规格 '+meta.spec);
          if(meta.price>0) txt.push('参考价 ¥'+meta.price+'/箱'+(meta.date?'（'+meta.date+'）':''));
          rhint.textContent=txt.join(' · ');
          rhint.style.color=txt.length?'#0F6E56':'#8A8985';
          if(meta.price>0 && !(draft.rows[idx] && draft.rows[idx].amtManual)){
            var q=Number(refs.qty.value)||0;
            if(q>0){
              var a=Math.round(q*meta.price*100)/100;
              refs.amt.value=String(a);
              draft.rows[idx].amt=String(a);
            }
          }
        }
        rw.appendChild(oIn('产品名称','sku',r.sku,'text'));
        rw.appendChild(oIn('数量(箱)','qty',r.qty,'number','110px'));
        rw.appendChild(oIn('金额(¥)','amt',r.amt,'number','120px'));
        rw.appendChild(oIn('订货日期','date',r.date,'date','160px'));
        var chSel3=document.createElement('select');
        chSel3.className='inp';
        chSel3.style.cssText='width:100%;font-size:15px';
        ['线下门店','批发流通','线上电商','社区团购'].forEach(function(t){
          var o=document.createElement('option'); o.value=t; o.textContent=t; chSel3.appendChild(o);
        });
        chSel3.value=(draft.rows[idx] && draft.rows[idx].ch) || r.ch || '线下门店';
        chSel3.setAttribute('data-rk','ch');
        chSel3.onchange=function(){ draft.rows[idx].ch=chSel3.value; };
        var chw3=el('div'); chw3.style.cssText='flex:1;min-width:110px;max-width:140px';
        var chl3=el('div','sub','渠道'); chl3.style.marginBottom='2px';
        chw3.appendChild(chl3); chw3.appendChild(chSel3);
        rw.appendChild(chw3);
        /* 行删除（至少保留一行） */
        var delBtn=el('button','btn btn-sm','×');
        delBtn.type='button';
        delBtn.style.cssText='min-height:38px;min-width:38px';
        delBtn.title='删除本行';
        if(draft.rows.length<=1){ delBtn.disabled=true; delBtn.style.opacity='0.4'; }
        delBtn.onclick=function(){
          draft.rows.splice(idx,1);
          if(!draft.rows.length) draft.rows.push(blankRow());
          draft.force=false;
          refreshAll();
        };
        rw.appendChild(delBtn);
        rw.appendChild(rhint);
        autoFill();
        rowsWrap.appendChild(rw);
      });
      panel.appendChild(rowsWrap);

      var addRowBtn=el('button','btn btn-sm','+ 增加一行');
      addRowBtn.type='button';
      addRowBtn.style.cssText='margin-top:8px;min-height:38px';
      addRowBtn.onclick=function(){
        draft.rows.push(blankRow());
        draft.force=false;
        refreshAll();
      };
      panel.appendChild(addRowBtn);

      /* 保存（先查重） */
      var saveWrap=el('div','row');
      saveWrap.style.cssText='margin-top:12px;gap:8px;align-items:center';
      var saveBtn=el('button','btn btn-p', draft.force?'仍要保存':'保存修改与订货');
      saveBtn.type='button';
      saveBtn.style.minHeight='42px';
      saveBtn.onclick=function(){
        try{
          /* 读主数据 */
          var mk={};
          Array.from(panel.querySelectorAll('[data-mk]')).forEach(function(n){
            var k=n.getAttribute('data-mk');
            mk[k]=n.value.trim();
          });
          /* 读订货行 */
          var rows=[];
          Array.from(rowsWrap.children).forEach(function(rw){
            if(!rw.className || rw.className.indexOf('row')<0) return;
            var r={};
            rw.querySelectorAll('[data-rk]').forEach(function(n){ r[n.getAttribute('data-rk')]=n.value.trim(); });
            rows.push(r);
          });
          rows=rows.filter(function(r){ return r.sku || r.qty || r.amt; });
          var validRows=rows.filter(function(r){ return r.sku && (Number(r.qty)||0)>0 && (Number(r.amt)||0)>0; });
          if(!validRows.length && !hasMasterChange(m, mk)){
            toast('没有需要保存的内容'); return;
          }
          /* 重复校验 */
          if(validRows.length && !draft.force){
            var dups=orderDup(name, validRows, cache.orders);
            if(dups>0){
              draft.force=true;
              toast('发现 '+dups+' 条与历史重复（同客户+产品+数量+金额），确认无误点「仍要保存」');
              refreshAll();
              return;
            }
          }
          var jobs=[];
          /* 档案修改 */
          if(hasMasterChange(m, mk)){
            var mp={'客户名称':{text:name}};
            if(mk['联系人']) mp['联系人']={text:mk['联系人']};
            if(mk['联系方式']) mp['联系方式']={text:mk['联系方式']};
            if(mk['客户地址']) mp['客户地址']={text:mk['客户地址']};
            if(mk['渠道']) mp['渠道']={select:mk['渠道']};
            jobs.push(writeCust((m.id||m._id||null), mp));
            jobs.push(writeLog({'时间':{text:nowStamp()},'模块':{select:'客户档案'},'对象':{text:name},'动作':{select:m.id?'修改':'新增'},
              '内容':{text:'档案信息更新（联系人/联系方式/地址/渠道）'}}));
          }
          /* 订货写入 */
          validRows.forEach(function(r){
            var q=Number(r.qty)||0, a=Number(r.amt)||0;
            jobs.push(writeOrder({'经销商名称':{text:name}, '订货日期':{date:r.date||ymd(new Date())},
              'SKU名称':{text:r.sku}, '品类':{text:skuCatOf(r.sku)}, '数量(箱)':{number:q},
              '单价(元/箱)':{number: q?Math.round(a/q*100)/100:0}, '金额':{currency:a}, '渠道':{text:r.ch||'线下门店'}}));
          });
          if(validRows.length){
            jobs.push(writeLog({'时间':{text:nowStamp()},'模块':{select:'客户档案'},'对象':{text:name},'动作':{select:'新增'},
              '内容':{text:'录入订货 '+validRows.length+' 笔：'+validRows.map(function(r){ return r.sku+'×'+r.qty; }).join('，')}}));
          }
          setSync('同步中');
          Promise.all(jobs)
            .then(function(){ return fetchData(); })
            .then(function(){
              draft.rows=[blankRow()]; draft.force=false;
              custEdit[name]=false;
              wroteOk('已保存'+(validRows.length?('（订货 '+validRows.length+' 笔）'):''));
              refreshAll();
            })
            .catch(function(e){ console.error('[cust-edit] 保存异常:', e); toast('保存失败：'+((e&&e.message)||'请稍后重试')); });
        }catch(e){
          console.error('[cust-edit] 保存异常:', e);
          toast('操作失败：'+((e&&e.message)||e));
        }
      };
      saveWrap.appendChild(saveBtn);
      if(draft.force){
        var warn=el('span','sub','检测到重复录入，再点一次将强制保存');
        warn.style.cssText='font-size:12px;color:#A32D2D';
        saveWrap.appendChild(warn);
      }
      panel.appendChild(saveWrap);
      blk.appendChild(panel);
    }
    box.appendChild(blk);
  });

  /* 渠道分布（订单口径） */
  var allOrders=cache.orders.filter(function(o){ return !curCust || o['经销商名称']===curCust; });
  var chMap={};
  allOrders.forEach(function(o){ var k=o['渠道']||'未填'; chMap[k]=(chMap[k]||0)+(Number(o['金额'])||0); });
  var chKeys=Object.keys(chMap).sort(function(a,b){ return chMap[b]-chMap[a]; });
  if(chKeys.length){
    box.appendChild(el('div','sec','渠道分布（按订货金额）'));
    var chMax=Math.max.apply(null, chKeys.map(function(k){ return chMap[k]; }))||1;
    chKeys.forEach(function(k){
      var r=el('div','rk');
      r.appendChild(el('span','nm',k)).style.width='88px';
      var bw=el('div','bw'); var bi=el('i');
      bi.style.width=Math.round(chMap[k]/chMax*100)+'%';
      bi.style.background=line.c;
      bw.appendChild(bi); r.appendChild(bw);
      r.appendChild(el('span','sub',fmtMoney(chMap[k])));
      box.appendChild(r);
    });
  }

  /* 修改日志（最近 10 条） */
  box.appendChild(el('div','sec','修改日志（最近 10 条'+(curCust?' · '+curCust:'')+'）'));
  var logs=cache.logs.filter(function(g){ return !curCust || String(g['对象']||'')===curCust; })
    .sort(function(a,b){ return String(b['时间']||'').localeCompare(String(a['时间']||'')); });
  if(!logs.length){
    box.appendChild(el('div','empty','还没有修改记录'));
  }else{
    logs.slice(0,10).forEach(function(g){
      var r=el('div','ckrow');
      var head=el('div');
      head.style.cssText='display:flex;align-items:center;gap:6px;flex-wrap:wrap';
      var mt=el('span','tag', g['模块']||'');
      mt.style.background='#F1EFE8'; mt.style.color='#6B6A66';
      head.appendChild(mt);
      var at=el('span','tag', g['动作']||'');
      if(g['动作']==='新增'){ at.style.background='#E1F5EE'; at.style.color='#0F6E56'; }
      else if(g['动作']==='修改'){ at.style.background='#FAEEDA'; at.style.color='#854F0B'; }
      else { at.style.background='#FCE8E8'; at.style.color='#A32D2D'; }
      head.appendChild(at);
      head.appendChild(el('span','sub', g['对象']||''));
      head.appendChild(el('span','sub', g['时间']||''));
      r.appendChild(head);
      r.appendChild(el('div','sub', g['内容']||''));
      box.appendChild(r);
    });
  }
}
/* 主数据是否有变更 */
function hasMasterChange(m, mk){
  function nz(x){ return (x||'').trim(); }
  return nz(mk['联系人'])!==nz(m['联系人'])
      || nz(mk['联系方式'])!==nz(m['联系方式'])
      || nz(mk['客户地址'])!==nz(m['客户地址'])

function dist(rows, field){
  var m={};
  rows.forEach(function(r){ var k=r[field]||'未填'; m[k]=(m[k]||0)+1; });
  return Object.keys(m).map(function(k){ return {k:k, v:m[k]}; })
    .sort(function(a,b){ return b.v-a.v; });
}


function distBar(rows, field, color, box, title){
  var d=dist(rows, field);
  if(!d.length) return;
  box.appendChild(el('div','sec',title));
  var max=Math.max.apply(null, d.map(function(x){ return x.v; }))||1;
  d.forEach(function(x){
    var r=el('div','rk');
    r.appendChild(el('span','nm',x.k)).style.width='76px';
    var bw=el('div','bw'); var bi=el('i');
    bi.style.width=Math.round(x.v/max*100)+'%';
    bi.style.background=color;
    bw.appendChild(bi); r.appendChild(bw);
    r.appendChild(el('span','sub', x.v+' 次'));
    box.appendChild(r);
  });
}


function computeHomeworkStats(){
  var s={sessions:cache.hw.length, minutes:0, weak:0,
         wrong:cache.wrong.length, pending:0, fixed:0, fixRate:0};
  cache.hw.forEach(function(h){
    s.minutes += Number(h['时长(分钟)'])||0;
    if(h['掌握情况']==='需加强') s.weak++;
  });
  cache.wrong.forEach(function(w){
    if(w['已订正']===true) s.fixed++; else s.pending++;
  });
  s.fixRate = s.wrong ? Math.round(s.fixed/s.wrong*100) : 0;
  return s;
}

/* ---- 销售额达成计分：门槛与同期取高值为标的，分段计分，拿满 70 分封顶 ---- */
function scoreOf(gate, same, real){
  var gateHigh = gate >= same;
  var base = Math.max(gate, same);
  var rate = base ? real/base : 0;
  var score = 0, note = '';
  if(gateHigh){
    if(rate >= 0.8){ score = 70; note = '完成率已达 80% 线，拿满 70 分（封顶，超额不加分）'; }
    else { score = 70*rate/0.8; note = '不足 80%，按门槛完成百分比折算'; }
  }else{
    if(rate >= 1){ score = 70; note = '完成 100%，拿满 70 分（封顶，超额不加分）'; }
    else { score = 0; note = '同期更高且完成不足 100%，记 0 分'; }
  }
  return {base:base, rate:rate, gateHigh:gateHigh,
          score:Math.round(score*10)/10, note:note, gate:gate, same:same, real:real};
}

function parseNoteIntent(txt){
  var t=txt.trim();
  if(!t) return null;
  /* 新增客户：新(增/建/开/添加/一个/一家…)客户 名称 */
  var m=t.match(/(?:新增|新建|新开|添加|新|加)(?:一个|一家|个|家)?客户/);
  if(m){
    var rest=t.slice(m.index+m[0].length).replace(/^[\s:：,，、]*/,'');
    var name=rest.split(/[\s,，。;；！!？?]/)[0];
    if(name) return {type:'cust', name:name};
  }
  return null;
}

/* ---- 打卡写库：今日无记录则创建，有则取反 ---- */
var lastCheckMsg = null;
function toggleCheck(node, rec, todayStr){
  var field=node.k;
  if(!ensureDb()) {
    lastCheckMsg={ok:false, t:'✗ 没连上数据表：'+sdkDiag()+'（点下方「立即重连」）'};
    toast('没连上数据表，无法写入');
    autoReconnect();
    refreshAll();
    return;
  }
  var cur = !!(rec && rec[field]===true);
  var next = !cur;
  var props = {};
  props[field] = {checkbox: next};
  /* 乐观更新：先让界面立刻有反馈，再写库；写失败回滚 */
  var target=rec, created=false;
  if(!target){
    target={日期:todayStr};
    cache.checks.push(target);
    created=true;
  }
  target[field]=next;
  setSync('同步中');
  lastCheckMsg={ok:true, t:'…'+(next?'已打卡：':'已取消：')+node.n+'（正在保存）'};
  toast((next?'已打卡：':'已取消：')+node.n);
  refreshAll();
  var rid = rec ? (rec.id||rec._id||rec.recordId||'') : '';
  var op;
  if(rec && rid){
    op = db.updateRecord({databaseId:'2oiXI7NgV4T56mTqDJgaNu', recordId:rid, properties:props});
  }else{
    props['日期'] = {date: todayStr};
    op = db.addRecord({databaseId:'2oiXI7NgV4T56mTqDJgaNu', properties:props});
  }
  op.then(function(){ return fetchData(); })
    .then(function(){
      setSync('已同步');
      lastCheckMsg={ok:true, t:'✓ 已保存：'+node.n+' → '+(next?'已完成':'未完成')};
      refreshAll();
    })
    .catch(function(e){
      console.error('[checkin] 写入失败:', e);
      if(created){ cache.checks=cache.checks.filter(function(c){ return c!==target; }); }
      else { try{ rec[field]=cur; }catch(_e){} }
      setSync('离线模式');
      var cmsg=(e&&(e.message||e.msg))||'未知错误';
      lastCheckMsg={ok:false, t:'✗ 没保存上：'+cmsg+'（请再点一次）'};
      toast('打卡没保存上：'+cmsg);
      /* 以云端为准重拉一次，清掉本地乐观值残留 */
      (db ? fetchData() : Promise.resolve()).then(refreshAll, refreshAll);
    });
}

function fillSelect(sel, schema, fieldName){
  if(!sel) return;
  var cur=sel.value;
  sel.innerHTML='<option value="">请选择</option>';
  var list = Object.prototype.toString.call(schema)==='[object Array]' ? schema : [];
  list.forEach(function(f){
    if(f.name!==fieldName || f.type!=='select') return;
    (f.config&&f.config.options||[]).forEach(function(o){
      var op=document.createElement('option');
      op.value=o.id; op.textContent=o.text;
      sel.appendChild(op);
    });
  });
  if(cur) sel.value=cur;
}

/* 刷新前从 DOM 收割客户档案编辑草稿（防查重拦截等刷新后输入被清空）。
   只按已有索引同步值，行的增删由 +/- 按钮管理，避免覆盖刚添加的行 */
function harvestCustDrafts(){
  Array.from(document.querySelectorAll('.prof')).forEach(function(blk){
    var nmEl=blk.querySelector('.ckt');
    if(!nmEl) return;
    var name=nmEl.textContent.trim();
    if(!custEdit[name] || !custDraft[name]) return;
    var d=custDraft[name];
    if(!d.master) d.master={};
    Array.from(blk.querySelectorAll('[data-mk]')).forEach(function(n){
      d.master[n.getAttribute('data-mk')]=n.value;
    });
    Array.from(blk.querySelectorAll('[data-rk="sku"]')).forEach(function(si, i){
      if(!d.rows[i]) return;
      var rowEl=si.parentNode && si.parentNode.parentNode;
      if(!rowEl) return;
      Array.from(rowEl.querySelectorAll('[data-rk]')).forEach(function(n){
        d.rows[i][n.getAttribute('data-rk')]=n.value;
      });
    });
  });
}

    var a=document.createElement('a');

    var f=e.target.files&&e.target.files[0]; if(!f) return;

        var d=JSON.parse(String(r.result));

        localCache('todos',cache.todos); localCache('months',cache.months); localCache('notes',cache.notes); localCache('cust',cache.cust); localCache('logs',cache.logs);
        localCache('scores',cache.scores);

    };
    r.readAsText(f); e.target.value='';
  };
}

}

function init(){
  /* 拿得到 SDK 就走在线；拿不到也立刻渲染本地缓存，靠后台探活自愈，不让页面空等 */
  fileBanner();
  var d0 = getDb();
  if(d0){ db = d0; online = true; onlineBoot(); return; }
  offlineBoot();
}
function offlineBoot(){
  cache.todos=localCache('todos')||[];
  cache.orders=localCache('orders')||[];
  cache.skus=localCache('skus')||[];
  cache.kpis=localCache('kpis')||[];
  cache.checks=localCache('checks')||[];
  cache.hw=localCache('hw')||[];
  cache.wrong=localCache('wrong')||[];
  cache.months=localCache('months')||[];
  cache.notes=localCache('notes')||[];
  cache.cust=localCache('cust')||[];
  cache.logs=localCache('logs')||[];
  cache.scores=localCache('scores')||[];
  setSync('离线模式');
  renderForms(); restoreFormInputs(); cacheFormInputs(); bindEvents(); refreshAll();
  /* 进入离线不代表结束：后台继续探活，连上自动恢复，不用用户刷新 */
  autoReconnect();
}
function onlineBoot(){
  readSchemas()
    .then(function(){ return fetchData(); })
    .then(function(){
      renderForms(); restoreFormInputs(); cacheFormInputs(); bindEvents(); refreshAll();
      if(typeof db.onUpdated==='function'){
        var timer=null;
        db.onUpdated(function(payload){
          var ids=(payload&&payload.databaseIds)||[];
          if(ids.indexOf(TODO_DB)===-1
             && ids.indexOf(MONTH_DB)===-1
             && ids.indexOf(NOTE_DB)===-1
             && ids.indexOf(LOG_DB)===-1
             && ids.indexOf(CUST_DB)===-1) return;
          if(timer) clearTimeout(timer);
          timer=setTimeout(function(){ fetchData().then(refreshAll); }, 300);
        });
      }
    })
    .catch(function(e){
      console.error('[init]', e);
      offlineBoot();
    });
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
</body>
</html>
